name: Bug report
description: Report a reproducible defect in the FinSight prototype.
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Do not attach real invoices, receipts, credentials, or personal data. Use synthetic examples only.
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead? Include sanitized errors only.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      description: Provide the smallest reproducible sequence using synthetic data.
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Environment
      description: Node, OS, browser, and project version.
    validations:
      required: true
