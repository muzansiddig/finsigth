name: Feature request
description: Propose a scoped, testable product improvement.
title: "[Feature]: "
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Keep requests scoped and include acceptance criteria. Never include real financial documents or secrets.
  - type: textarea
    id: problem
    attributes:
      label: User problem
      description: Who has this problem and what task are they trying to complete?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the smallest useful change.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List observable success and failure cases.
      placeholder: |
        - Given ...
        - When ...
        - Then ...
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Data safety
      options:
        - label: I have not attached customer financial data, personal information, or credentials.
          required: true
